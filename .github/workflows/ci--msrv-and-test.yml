name: MSRV Check & Full Test

on:
  push:
    tags:
      - 'msrv-test'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_VERBOSE: 1

jobs:
  msrv-test:
    name: MSRV & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo build on stable
        run: cargo build --workspace --release --verbose

      - name: Cargo test on stable
        run: >
          cargo test --workspace --profile test --verbose
          --no-fail-fast -- --test-threads 5 --show-output
      - name: Cargo test release on stable
        run: >
          cargo test --workspace --release --verbose
          --no-fail-fast -- --test-threads 5 --show-output

      - name: Install cargo-msrv
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-msrv

      - name: MSRV verify
        run: cargo msrv verify --workspace

      - name: MSRV verify build
        run: >
          cargo msrv verify --
          cargo build --workspace --release --verbose

      - name: MSRV verify test
        run: >
          cargo msrv verify --
          cargo test --workspace --profile test --verbose
          --no-fail-fast -- --test-threads 5 --show-output
      - name: MSRV verify test release
        run: >
          cargo msrv verify --
          cargo test --workspace --release --verbose
          --no-fail-fast -- --test-threads 5 --show-output
