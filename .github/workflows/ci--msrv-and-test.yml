name: MSRV Check & Full Test

on:
  push:
    tags:
      - 'msrv-test'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv-test:
    name: MSRV & Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        member:
          - type_identical
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo build on stable
        run: cargo build --workspace --release --verbose

      - name: Cargo test on stable
        run: >
          cargo test --workspace --profile test --verbose
          --no-fail-fast -- --test-threads 5 --show-output
      - name: Cargo test release on stable
        run: >
          cargo test --workspace --release --verbose
          --no-fail-fast -- --test-threads 5 --show-output

      - name: Install cargo-msrv
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-msrv

      - name: MSRV verify for ${{ matrix.member }}
        run: cargo msrv verify --path ${{ matrix.member }}

      - name: MSRV build
        run: >
          cargo msrv --
          cargo build --workspace --release --verbose

      - name: MSRV test
        run: >
          cargo msrv --
          cargo test --workspace --profile test --verbose
          --no-fail-fast -- --test-threads 5 --show-output
      - name: MSRV test release
        run: >
          cargo msrv --
          cargo test --workspace --release --verbose
          --no-fail-fast -- --test-threads 5 --show-output
